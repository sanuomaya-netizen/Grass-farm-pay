<script>
/*GEO-START*/
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
function heron(a,b,c){
  if(!(a>0&&b>0&&c>0))return null;
  if(a+b<=c||a+c<=b||b+c<=a)return null;
  const s=(a+b+c)/2;
  return Math.sqrt(Math.max(0,s*(s-a)*(s-b)*(s-c)));
}
/* Quad: sides a=AB, b=BC, c=CD, d=DA, diagonal p=AC. Area = Heron(a,b,p) + Heron(c,d,p).
   Without diagonal: Brahmagupta (maximum possible area, an estimate). */
function calcArea(shape,d,noDiag){
  const g=k=>num(d[k]);
  if(shape==='rect'){const l=g('l'),w=g('w');return l>0&&w>0?{area:l*w}:{area:0,empty:true}}
  if(shape==='direct'){const a=g('area');return a>0?{area:a}:{area:0,empty:true}}
  if(shape==='tri'){
    const a=g('a'),b=g('b'),c=g('c');
    if(!(a&&b&&c))return{area:0,empty:true};
    const A=heron(a,b,c);return A?{area:A}:{area:0,err:true};
  }
  if(shape==='quad'){
    /* a=Width 1, c=Width 2, b=Length 1, d=Length 2 : area = ((W1+W2)/2) x ((L1+L2)/2) */
    const w1=g('a'),w2=g('c'),l1=g('b'),l2=g('d');
    if(!(w1>0&&w2>0&&l1>0&&l2>0))return{area:0,empty:true};
    return{area:((w1+w2)/2)*((l1+l2)/2)};
  }
  return{area:0,empty:true};
}
function polyPts(shape,d,noDiag){
  const g=k=>num(d[k]);
  if(shape==='tri'){
    const a=g('a'),b=g('b'),c=g('c');if(!heron(a,b,c))return null;
    const x=(b*b+c*c-a*a)/(2*c),y=Math.sqrt(Math.max(0,b*b-x*x));
    return{P:[[0,0],[c,0],[x,y]],L:['A','B','C'],E:[['c',0,1],['a',1,2],['b',2,0]]};
  }
  if(shape==='quad'&&!noDiag){
    const a=g('a'),b=g('b'),c=g('c'),e=g('d'),p=g('p');
    if(!(heron(a,b,p)&&heron(c,e,p)))return null;
    const xb=(a*a+p*p-b*b)/(2*p),yb=Math.sqrt(Math.max(0,a*a-xb*xb));
    const xd=(e*e+p*p-c*c)/(2*p),yd=Math.sqrt(Math.max(0,e*e-xd*xd));
    return{P:[[0,0],[xb,yb],[p,0],[xd,-yd]],L:['A','B','C','D'],E:[['a',0,1],['b',1,2],['c',2,3],['d',3,0]],diag:[0,2]};
  }
  return null;
}
/*GEO-END*/

function rangeDates(){
  const r=ui.range,now=new Date();
  if(r.mode==='week'){const d=new Date(now);d.setDate(d.getDate()-((d.getDay()+6)%7));const e=new Date(d);e.setDate(d.getDate()+6);return{from:iso(d),to:iso(e)}}
  if(r.mode==='month')return{from:iso(new Date(now.getFullYear(),now.getMonth(),1)),to:iso(new Date(now.getFullYear(),now.getMonth()+1,0))};
  if(r.mode==='custom')return{from:r.from||'',to:r.to||''};
  return{from:'',to:''};
}
const inR=(x,rg)=>(!rg.from||x.date>=rg.from)&&(!rg.to||x.date<=rg.to);
const periodLabel=rg=>(!rg.from&&!rg.to)?t('all'):(rg.from||'…')+' → '+(rg.to||'…');
const shapeName=s=>t(SHAPES[s]||'sDirect');
function dimText(p){
  const d=p.dims||{};
  if(p.shape==='rect')return d.l+' × '+d.w;
  if(p.shape==='tri')return d.a+' · '+d.b+' · '+d.c;
  if(p.shape==='quad')return d.a+' · '+d.b+' · '+d.c+' · '+d.d+(p.noDiag?' (≈)':(d.p?' | AC '+d.p:''));
  return '';
}

function exprText(p){
  const d=p.dims||{},nz=n=>String(r2(n));let e='';
  if(p.shape==='rect')e=d.l+' × '+d.w;
  else if(p.shape==='tri')e='△ '+d.a+', '+d.b+', '+d.c;
  else if(p.shape==='quad')e=(p.noDiag||d.p)?dimText(p):'('+d.a+'+'+d.c+')/2 × ('+d.b+'+'+d.d+')/2';
  return (e?e+' = ':'= ')+(p.noDiag?'≈ ':'')+nz(p.area);
}

/* ---------- computation ---------- */
function compute(rg){
  const plots=db.plots.filter(p=>inR(p,rg));
  const advs=db.advances.filter(a=>inR(a,rg));
  const advOf=id=>r2(advs.filter(a=>a.workerId===id).reduce((s,a)=>s+a.amount,0));
  const planters=db.workers.filter(w=>w.role==='planter').map(w=>{
    const mine=plots.filter(p=>p.workerId===w.id),g={};
    mine.forEach(p=>{const k=p.grassName+'|'+p.rate;(g[k]=g[k]||{name:p.grassName,rate:p.rate,area:0});g[k].area+=p.area});
    const lines=Object.values(g).map(x=>({name:x.name,rate:x.rate,area:r2(x.area),amount:r2(x.area*x.rate)}));
    const area=r2(mine.reduce((s,p)=>s+p.area,0)),pay=r2(lines.reduce((s,l)=>s+l.amount,0)),adv=advOf(w.id);
    return{w,mine,lines,n:mine.length,area,pay,adv,net:r2(pay-adv)};
  });
  const kp=plots.filter(p=>p.kohubath),kg={};
  kp.forEach(p=>{const k=String(p.kRate);(kg[k]=kg[k]||{rate:p.kRate,area:0});kg[k].area+=p.area});
  const kLines=Object.values(kg).map(x=>({rate:x.rate,area:r2(x.area),amount:r2(x.area*x.rate)}));
  const kArea=r2(kp.reduce((s,p)=>s+p.area,0)),kPay=r2(kLines.reduce((s,l)=>s+l.amount,0));
  const cw=db.workers.filter(w=>w.role==='kohubath');let la=kArea,lp=kPay;
  const crew=cw.map((w,i)=>{
    const last=i===cw.length-1,ar=last?r2(la):r2(kArea/cw.length),sh=last?r2(lp):r2(kPay/cw.length);
    la=r2(la-ar);lp=r2(lp-sh);const adv=advOf(w.id);
    return{w,area:ar,share:sh,adv,net:r2(sh-adv)};
  });
  const plantArea=r2(plots.reduce((s,p)=>s+p.area,0)),plantPay=r2(planters.reduce((s,x)=>s+x.pay,0));
  const advP=r2(planters.reduce((s,x)=>s+x.adv,0)),advK=r2(crew.reduce((s,x)=>s+x.adv,0));
  const grand=r2(plantPay+kPay),advTotal=r2(advP+advK);
  return{plots,planters,crew,kLines,kArea,kPay,plantArea,plantPay,advP,advK,advTotal,grand,netTotal:r2(grand-advTotal)};
}

/* ---------- sheet / dialog / toast ---------- */
function openSheet(title,body){
  const s=$('#sheet'),was=s.classList.contains('open'),st=s.scrollTop;
  s.innerHTML='<div class="grab"></div><div class="sh-h"><h2>'+esc(title)+'</h2><button class="x" data-act="closeSheet" aria-label="close">✕</button></div>'+body;
  s.classList.add('open');$('#scrim').classList.add('on');document.body.classList.add('lock');
  s.scrollTop=was?st:0;
}
function closeSheet(){$('#sheet').classList.remove('open');$('#scrim').classList.remove('on');document.body.classList.remove('lock');cur=null}
function confirmBox(msg,cb,label){
  dlgCb=cb;
  $('#dlg').innerHTML='<div class="dlg"><p>'+esc(msg)+'</p><div class="btns"><button class="btn sec" data-act="dlgNo">'+t('cancel')+'</button><button class="btn danger" data-act="dlgYes">'+(label||t('del'))+'</button></div></div>';
  $('#dlg').classList.add('on');
}
let tT;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('on'),2300)}

  const rg=rangeDates(),C=compute(rg);

  else if(db.plots.length&&needBackup())h+='<div class="warn" data-act="tab" data-v="settings">'+t('backupWarn')+'</div>';
  h+='<div class="hero"><div class="k">'+t('totalPay')+'</div><div class="big">'+money(C.grand)+'</div><div class="g3">'
    +'<div><div class="k">'+t('plantedArea')+' ('+t('sqft')+')</div><div class="v">'+fmt(C.plantArea)+'</div></div>'
    +'<div><div class="k">'+t('plantingPay')+'</div><div class="v">'+money(C.plantPay)+'</div></div>'

function renderPlots(){
  const rg=rangeDates();
  const planters=db.workers.filter(w=>w.role==='planter');
  let list=[...db.plots].reverse().filter(p=>inR(p,rg)&&(!ui.pw||p.workerId===ui.pw));
  list.sort((a,b)=>b.date.localeCompare(a.date));
  let h=rangeBar()+'<div class="f"><select data-bind="pw"><option value="">'+t('allWorkers')+'</option>'+planters.map(w=>'<option value="'+w.id+'" '+(ui.pw===w.id?'selected':'')+'>'+esc(w.name)+'</option>').join('')+'</select></div>';
  const ta=r2(list.reduce((s,p)=>s+p.area,0)),tp=r2(list.reduce((s,p)=>s+p.area*p.rate,0));
  h+='<div class="mut">'+list.length+' '+t('plotsN')+' · '+fmt(ta)+' '+t('sqft')+' · '+money(tp)+'</div>';
  if(!list.length)h+='<div class="card empty">'+t('noPlots')+'</div>';
  list.forEach(p=>{
    const w=db.workers.find(x=>x.id===p.workerId);
    h+='<div class="card" data-act="editPlot" data-id="'+p.id+'"><div class="row"><b>'+esc(w?w.name:'?')+(p.label?' · '+esc(p.label):'')+'</b><b>'+money(r2(p.area*p.rate))+'</b></div>'
      +'<div class="mut">'+p.date+' · '+esc(p.grassName)+' @ Rs '+p.rate+' · '+shapeName(p.shape)+' ('+dimText(p)+')</div>'
      +'<div class="row"><span>'+(p.noDiag?'≈ ':'')+fmt(p.area)+' '+t('sqft')+'</span>'+(p.kohubath?'<span class="badge">'+t('kohubath')+'</span>':'')+'</div></div>';
  });

}

function reportHTML(C,rg,details){
  const adv=C.advTotal>0,cs=adv?5:3;
  let h='<div class="doc" id="reportDoc"><h2>'+esc(db.settings.farm||t('appName'))+'</h2><div class="dsub">'+t('payReport')+' · '+periodLabel(rg)+' · '+t('generated')+': '+today()+'</div>';
  const head=(first)=>'<div class="tw"><table class="t"><thead><tr><th>'+first+'</th><th class="n">'+t('areaCol')+'</th><th class="n">'+t('amtCol')+'</th>'+(adv?'<th class="n">'+t('advances')+'</th><th class="n">'+t('net')+'</th>':'')+'<th class="sig">'+t('sign')+'</th></tr></thead><tbody>';
  /* planters */
  h+='<h3>'+t('planters')+'</h3>'+head(t('name'));
  const act=C.planters.filter(x=>x.n||x.adv);
  if(!act.length)h+='<tr><td colspan="'+(cs+1)+'" class="mut">—</td></tr>';
  act.forEach(x=>{
    h+='<tr class="wr"><td>'+esc(x.w.name)+'</td><td class="n">'+fmt(x.area)+'</td><td class="n">'+fmt(x.pay)+'</td>'+(adv?'<td class="n">'+fmt(x.adv)+'</td><td class="n">'+fmt(x.net)+'</td>':'')+'<td class="sig"></td></tr>';
    x.lines.forEach(l=>{h+='<tr class="sub"><td>&nbsp;&nbsp;'+esc(l.name)+' × Rs '+l.rate+'</td><td class="n">'+fmt(l.area)+'</td><td class="n">'+fmt(l.amount)+'</td>'+(adv?'<td></td><td></td>':'')+'<td class="sig"></td></tr>'});
  });
  h+='<tr class="tot"><td>'+t('total')+'</td><td class="n">'+fmt(C.plantArea)+'</td><td class="n">'+fmt(C.plantPay)+'</td>'+(adv?'<td class="n">'+fmt(C.advP)+'</td><td class="n">'+fmt(r2(C.plantPay-C.advP))+'</td>':'')+'<td class="sig"></td></tr></tbody></table></div>';
  /* kohubath */
  h+='<h3>'+t('kohubath')+'</h3>'+head(t('kAreaRow'));
  if(!C.kLines.length)h+='<tr><td colspan="'+(cs+1)+'" class="mut">—</td></tr>';
  C.kLines.forEach(l=>{h+='<tr class="wr"><td>'+t('kohubath')+' × Rs '+l.rate+'</td><td class="n">'+fmt(l.area)+'</td><td class="n">'+fmt(l.amount)+'</td>'+(adv?'<td></td><td></td>':'')+'<td class="sig"></td></tr>'});
  if(C.kPay>0||C.crew.length){
    if(!C.crew.length)h+='<tr class="sub"><td colspan="'+(cs+1)+'">'+t('crewNone')+'</td></tr>';
    C.crew.forEach(x=>{h+='<tr class="wr"><td>'+esc(x.w.name)+'</td><td class="n">'+fmt(x.area)+'</td><td class="n">'+fmt(x.share)+'</td>'+(adv?'<td class="n">'+fmt(x.adv)+'</td><td class="n">'+fmt(x.net)+'</td>':'')+'<td class="sig"></td></tr>'});
  }
  h+='</tbody></table></div>';
  /* summary */
  const sr=(a,b,c)=>'<tr'+(c?' class="tot"':'')+'><td>'+a+'</td><td class="n">'+b+'</td></tr>';
  h+='<h3>'+t('summary')+'</h3><div class="tw"><table class="t"><tbody>'+sr(t('plantedArea')+' ('+t('sqft')+')',fmt(C.plantArea))+sr(t('plantingPay'),money(C.plantPay))+sr(t('kPay'),money(C.kPay))+sr(t('grandTotal'),money(C.grand),1)
    +(adv?sr(t('advances'),'- '+money(C.advTotal))+sr(t('net'),money(C.netTotal),1):'')+'</tbody></table></div>';
  /* details */
  if(details&&C.plots.length){
    h+='<div class="brk"></div><h3>'+t('plots')+'</h3>';
    C.planters.filter(x=>x.n).forEach(x=>{
      h+='<div class="tw" style="margin-bottom:14px"><table class="t"><thead><tr><th colspan="4">'+esc(x.w.name)+'</th></tr></thead><tbody>';
      [...x.mine].sort((a,c)=>a.date.localeCompare(c.date)).forEach(p=>{h+='<tr><td>'+p.date+(p.label?' ('+esc(p.label)+')':'')+'</td><td>'+esc(p.grassName)+' @ '+p.rate+'</td><td>'+exprText(p)+'</td><td class="n">'+fmt(r2(p.area*p.rate))+'</td></tr>'});
      x.lines.forEach(l=>{h+='<tr class="sub"><td colspan="2"></td><td class="n">'+esc(l.name)+': '+fmt(l.area)+' × '+l.rate+'</td><td class="n">'+fmt(l.amount)+'</td></tr>'});
      h+='<tr class="tot"><td colspan="2">'+t('total')+'</td><td class="n">'+fmt(x.area)+' '+t('sqft')+'</td><td class="n">'+fmt(x.pay)+'</td></tr></tbody></table></div>';
    });
  }
  return h+'</div>';
}

  h+=reportHTML(C,rg,ui.details);
  $('#s-report').innerHTML=h;
}
function reportText(){
  const rg=rangeDates(),C=compute(rg),L=[];
  L.push((db.settings.farm||t('appName'))+' — '+t('payReport'));L.push(periodLabel(rg));L.push('');
  C.planters.filter(x=>x.n||x.adv).forEach(x=>L.push(x.w.name+': '+fmt(x.area)+' '+t('sqft')+' — '+money(x.pay)+(x.adv?' ('+t('advances')+' '+money(x.adv)+' → '+money(x.net)+')':'')));
  L.push('');L.push(t('kohubath')+': '+fmt(C.kArea)+' '+t('sqft')+' — '+money(C.kPay));
  C.crew.forEach(x=>L.push('  '+x.w.name+': '+money(x.share)+(x.adv?' ('+t('advances')+' '+money(x.adv)+' → '+money(x.net)+')':'')));
  L.push('');L.push(t('plantedArea')+': '+fmt(C.plantArea)+' '+t('sqft'));L.push(t('grandTotal')+': '+money(C.grand));
  if(C.advTotal>0){L.push(t('advances')+': '+money(C.advTotal));L.push(t('net')+': '+money(C.netTotal))}
  return L.join('\n');
}
function copyText(s){
  const done=()=>toast(t('copied'));
  const fb=()=>{const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(done,fb);else fb();

function dimsHTML(){
  const D=cur.D,d=D.dims;
  const inp=(k,lab)=>'<div class="f"><label>'+lab+'</label><input type="number" inputmode="decimal" step="any" min="0" data-d="'+k+'" value="'+(d[k]==null?'':d[k])+'"></div>';
  if(D.shape==='rect')return'<div class="two">'+inp('l',t('length'))+inp('w',t('width'))+'</div>';
  if(D.shape==='tri')return'<div class="two3">'+inp('a',t('side')+' a (BC)')+inp('b',t('side')+' b (CA)')+inp('c',t('side')+' c (AB)')+'</div><div class="hint">'+t('hintTri')+'</div><div id="pf-pv"></div>';
  if(D.shape==='quad')return'<div class="two">'+inp('a',t('w1'))+inp('c',t('w2'))+inp('b',t('l1'))+inp('d',t('l2'))+'</div>'+'<div class="hint">'+t('hintQuad')+'</div><div id="pf-pv"></div>';
  return inp('area',t('directArea'));
}
function quadSchematic(){
  const si=db.settings.lang==='si';
  const L=si?['පළල 1','දිග 1','පළල 2','දිග 2']:['Width 1','Length 1','Width 2','Length 2'];
  const tx=(x,y,s)=>'<text x="'+x+'" y="'+y+'" class="el" text-anchor="middle" dominant-baseline="middle">'+s+'</text>';
  return '<svg viewBox="0 0 300 190" class="pv"><polygon points="55,38 250,30 268,150 38,160" fill="#e4f1e2" stroke="#2e7d32" stroke-width="2"/>'+tx(152,16,L[0])+tx(284,92,L[1])+tx(153,176,L[2])+tx(16,98,L[3])+'</svg>';
}
function previewSVG(shape,d,noDiag){
  if(shape==='quad')return quadSchematic();
  const o=polyPts(shape,d,noDiag);if(!o)return'';
  const W=300,H=190,pd=28,xs=o.P.map(q=>q[0]),ys=o.P.map(q=>q[1]);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const sc=Math.min((W-2*pd)/((maxx-minx)||1),(H-2*pd)/((maxy-miny)||1));
  const ox=(W-(maxx-minx)*sc)/2,oy=(H-(maxy-miny)*sc)/2;
  const Q=o.P.map(q=>[ox+(q[0]-minx)*sc,H-(oy+(q[1]-miny)*sc)]);
  const cx=Q.reduce((s,q)=>s+q[0],0)/Q.length,cy=Q.reduce((s,q)=>s+q[1],0)/Q.length;
  const f=v=>v.toFixed(1);
  const QL=db.settings.lang==='si'?{a:'පළල 1',b:'දිග 1',c:'පළල 2',d:'දිග 2'}:{a:'W1',b:'L1',c:'W2',d:'L2'};
  const elb=k=>shape==='quad'?(QL[k]||k):k;
  const lab=(x,y,txt,cls)=>'<text x="'+f(x)+'" y="'+f(y)+'" class="'+cls+'" text-anchor="middle" dominant-baseline="middle">'+txt+'</text>';
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="pv"><polygon points="'+Q.map(q=>f(q[0])+','+f(q[1])).join(' ')+'" fill="#e4f1e2" stroke="#2e7d32" stroke-width="2"/>';
  if(o.diag){const a=Q[o.diag[0]],b=Q[o.diag[1]];s+='<line x1="'+f(a[0])+'" y1="'+f(a[1])+'" x2="'+f(b[0])+'" y2="'+f(b[1])+'" stroke="#2e7d32" stroke-dasharray="5 4"/>'+lab((a[0]+b[0])/2,(a[1]+b[1])/2-8,'AC','el')}
  o.E.forEach(e=>{const m=[(Q[e[1]][0]+Q[e[2]][0])/2,(Q[e[1]][1]+Q[e[2]][1])/2];const dx=m[0]-cx,dy=m[1]-cy,L=Math.hypot(dx,dy)||1;s+=lab(m[0]+dx/L*12,m[1]+dy/L*12,elb(e[0]),'el')});
  Q.forEach((q,i)=>{const dx=q[0]-cx,dy=q[1]-cy,L=Math.hypot(dx,dy)||1;s+=lab(q[0]+dx/L*13,q[1]+dy/L*13,o.L[i],'vl')});
  return s+'</svg>';
}
function plotSheet(id){

  if(!planters.length){toast(t('needWorker'));return}
  const gs=db.settings.grass;let D;

    const g=gs.find(x=>x.id===pref.grassId)||gs[0];
    D={date:pref.date||today(),workerId:planters.some(w=>w.id===pref.workerId)?pref.workerId:planters[0].id,grassId:g.id,grassName:g.name,rate:g.rate,shape:pref.shape||'quad',dims:{},noDiag:false,kohubath:true,kRate:db.settings.kRate,label:'',note:''};
  }
  cur={D:D,res:{area:0},area:0};
  const wopts=planters.map(w=>'<option value="'+w.id+'" '+(w.id===D.workerId?'selected':'')+'>'+esc(w.name)+'</option>').join('');
  let gopts=gs.map(g=>'<option value="'+g.id+'" '+(g.id===D.grassId?'selected':'')+'>'+esc(g.name)+' (Rs '+g.rate+')</option>').join('');
  if(ex&&!gs.some(g=>g.id===D.grassId))gopts='<option value="'+esc(D.grassId)+'" selected>'+esc(D.grassName)+'</option>'+gopts;
  const shapes=Object.keys(SHAPES).map(k=>'<button class="chip '+(D.shape===k?'on':'')+'" data-act="pshape" data-v="'+k+'">'+t(SHAPES[k])+'</button>').join('');
  openSheet(ex?t('editPlot'):t('addPlot'),
   '<div class="f"><label>'+t('worker')+'</label><select data-f="workerId">'+wopts+'</select></div>'
  +'<div class="two"><div class="f"><label>'+t('date')+'</label><input type="date" data-f="date" value="'+D.date+'"></div><div class="f"><label>'+t('label')+'</label><input data-f="label" value="'+esc(D.label||'')+'"></div></div>'
  +'<div class="two"><div class="f"><label>'+t('grassType')+'</label><select data-f="grassId">'+gopts+'</select></div><div class="f"><label>'+t('rate')+'</label><input id="pf-rate" type="number" inputmode="decimal" step="any" data-f="rate" value="'+D.rate+'"></div></div>'
  +'<div class="f"><label>'+t('shape')+'</label><div class="chips" id="pf-shapes">'+shapes+'</div></div>'
  +'<div id="pf-dims">'+dimsHTML()+'</div><div id="pf-msg"></div>'
  +'<label class="chk"><input type="checkbox" data-f="kohubath" '+(D.kohubath?'checked':'')+'> '+t('kApplied')+'</label>'
  +'<div class="f"><label>'+t('kRate')+'</label><input type="number" inputmode="decimal" step="any" data-f="kRate" value="'+D.kRate+'"></div>'
  +'<div class="res"><div><span class="k">'+t('areaLbl')+' ('+t('sqft')+')</span><b id="pf-area">0.00</b></div><div><span class="k">'+t('payLbl')+'</span><b id="pf-pay"></b></div><div><span class="k">'+t('kpayLbl')+'</span><b id="pf-kpay"></b></div></div>'
  +'<div class="f"><label>'+t('note')+'</label><input data-f="note" value="'+esc(D.note||'')+'"></div>'
  +'<div class="btns"><button class="btn" data-act="psave">'+t('save')+'</button>'+(ex?'<button class="btn danger" data-act="pdel" data-id="'+ex.id+'">'+t('del')+'</button>':'<button class="btn sec" data-act="psaveAdd">'+t('saveAdd')+'</button>')+'</div>');
  plotRefresh();
}
function plotRefresh(){
  if(!cur)return;
  const D=cur.D,r=calcArea(D.shape,D.dims,D.noDiag);
  const pv=$('#pf-pv');if(pv)pv.innerHTML=previewSVG(D.shape,D.dims,D.noDiag);
  $('#pf-msg').innerHTML=r.err?'<div class="warn err">'+t('invalid')+'</div>':(r.approx&&r.area>0?'<div class="warn">'+t('estWarn')+'</div>':'');
  if(D.shape==='quad'&&r.area>0){const d=D.dims,aw=(num(d.a)+num(d.c))/2,al=(num(d.b)+num(d.d))/2;$('#pf-msg').innerHTML='<div class="hint"><b>'+t('avgW')+'</b> = ('+num(d.a)+' + '+num(d.c)+') ÷ 2 = '+fmt(aw)+'<br><b>'+t('avgL')+'</b> = ('+num(d.b)+' + '+num(d.d)+') ÷ 2 = '+fmt(al)+'<br>'+fmt(aw)+' × '+fmt(al)+'</div>'}
  const area=r2(r.area||0);
  $('#pf-area').textContent=fmt(area);
  $('#pf-pay').textContent=money(r2(area*num(D.rate)));
  $('#pf-kpay').textContent=D.kohubath?money(r2(area*num(D.kRate))):'—';
  cur.res=r;cur.area=area;
}
function plotSave(again){
  if(!cur)return;
  const D=cur.D;
  if(!(cur.area>0)||cur.res.err){toast(t('invalid'));return}
  if(!D.date)D.date=today();
  const dims={};KEYS[D.shape].forEach(k=>{if(!(k==='p'&&D.noDiag))dims[k]=num(D.dims[k])});
  D.dims=dims;D.rate=num(D.rate);D.kRate=num(D.kRate);D.area=cur.area;D.noDiag=false;
  if(!D.id){D.id=uid();db.plots.push(D)}else{const i=db.plots.findIndex(p=>p.id===D.id);if(i>=0)db.plots[i]=D}
  pref={workerId:D.workerId,date:D.date,grassId:D.grassId,shape:D.shape};
  save();closeSheet();render();toast(t('saved'));
  if(again)setTimeout(()=>plotSheet(null),250);
}

/* ---------- worker sheets ---------- */
function workerForm(id){
  const w=id?db.workers.find(x=>x.id===id):null;
  wfRole='planter';
  openSheet(w?t('editWorker'):t('addWorker'),
   '<div class="f"><label>'+t('name')+'</label><input id="wf-name" autocomplete="off" value="'+esc(w?w.name:'')+'"></div>'
  +(w?'':'<div class="f"><label>'+t('role')+'</label><div class="chips" id="wf-role"><button class="chip on" data-act="wrole" data-v="planter">'+t('planter')+'</button><button class="chip" data-act="wrole" data-v="kohubath">'+t('kcrew')+'</button></div></div>')
  +'<div class="btns"><button class="btn sec" data-act="closeSheet">'+t('cancel')+'</button><button class="btn" data-act="wsave" data-id="'+(id||'')+'">'+t('save')+'</button></div>');
}
function workerSheet(id){
  const w=db.workers.find(x=>x.id===id);if(!w)return;
  const rg=rangeDates(),C=compute(rg);let b='<div class="mut">'+(w.role==='planter'?t('planter'):t('kcrew'))+' · '+t('period')+': '+periodLabel(rg)+'</div>';
  let advAmt=0;
  if(w.role==='planter'){
    const x=C.planters.find(q=>q.w.id===id);advAmt=x.adv;
    b+='<div class="sumgrid"><div><div class="k">'+t('areaLbl')+' ('+t('sqft')+')</div><b>'+fmt(x.area)+'</b></div><div><div class="k">'+t('plantingPay')+'</div><b>'+money(x.pay)+'</b></div><div><div class="k">'+t('advances')+'</div><b>'+money(x.adv)+'</b></div><div><div class="k">'+t('net')+'</div><b>'+money(x.net)+'</b></div></div>';
    if(x.mine.length){
      b+='<div class="sh"><h3>'+t('plots')+'</h3></div>';
      [...x.mine].sort((a,c)=>a.date.localeCompare(c.date)).forEach(p=>{b+='<div class="mini" data-act="editPlot" data-id="'+p.id+'"><div class="row"><b>'+exprText(p)+'</b><span>'+money(r2(p.area*p.rate))+'</span></div><div class="mut">'+p.date+' · '+esc(p.grassName)+' @ Rs '+p.rate+(p.label?' · '+esc(p.label):'')+'</div></div>'});
      b+='<div class="card" style="margin-top:10px">';
      x.lines.forEach(l=>{b+='<div class="row"><span>'+esc(l.name)+': '+fmt(l.area)+' × '+l.rate+'</span><b>'+money(l.amount)+'</b></div>'});
      b+='<div class="row" style="border-top:2px solid var(--tx);margin-top:6px;padding-top:6px"><b>'+t('total')+': '+fmt(x.area)+' '+t('sqft')+'</b><b>'+money(x.pay)+'</b></div></div>';
    }
  }else{
    const x=C.crew.find(q=>q.w.id===id);advAmt=x.adv;
    b+='<div class="sumgrid"><div><div class="k">'+t('kAreaRow')+'</div><b>'+fmt(C.kArea)+'</b></div><div><div class="k">'+t('kPay')+'</div><b>'+money(C.kPay)+'</b></div><div><div class="k">'+t('amtCol')+'</div><b>'+money(x.share)+'</b></div><div><div class="k">'+t('net')+'</div><b>'+money(x.net)+'</b></div></div>';
    C.kLines.forEach(l=>{b+='<div class="row"><span>'+fmt(l.area)+' × Rs '+l.rate+'</span><b>'+money(l.amount)+'</b></div>'});
  }
  const myAdv=db.advances.filter(a=>a.workerId===id&&inR(a,rg)).sort((a,c)=>c.date.localeCompare(a.date));
  b+='<div class="sh"><h3>'+t('advances')+'</h3></div>';
  myAdv.forEach(a=>{b+='<div class="row"><span>'+a.date+(a.note?' · '+esc(a.note):'')+'</span><span><b>'+money(a.amount)+'</b> <button class="x" data-act="advDel" data-id="'+a.id+'" data-w="'+id+'" aria-label="delete">✕</button></span></div>'});
  b+='<div class="two" style="margin-top:8px"><div class="f"><label>'+t('amount')+'</label><input id="adv-amt" type="number" inputmode="decimal" step="any"></div><div class="f"><label>'+t('date')+'</label><input id="adv-date" type="date" value="'+today()+'"></div></div><div class="f"><label>'+t('note')+'</label><input id="adv-note"></div><button class="btn sm sec" data-act="advAdd" data-id="'+id+'">+ '+t('addAdvance')+'</button>';
  b+='<div class="btns"><button class="btn sec" data-act="editWorker" data-id="'+id+'">'+t('edit')+'</button><button class="btn danger" data-act="delWorker" data-id="'+id+'">'+t('del')+'</button></div>';
  openSheet(w.name,b);
}

/* ---------- backup ---------- */
async function exportData(){
  db.meta.lastBackup=today();save();
  const data=JSON.stringify(db,null,1),name='grassfarm-backup-'+today()+'.json';
  let done=false;
  try{if(window.AndroidShare)done=!!window.AndroidShare.file(name,data,'application/json')}catch(e){}
  if(!done){
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);
  }
  render();
}

/* ---------- actions ---------- */
const A={
  tab(d){ui.tab=d.v;window.scrollTo(0,0);render()},
  lang(){db.settings.lang=db.settings.lang==='si'?'en':'si';save();render()},
  range(d){ui.range.mode=d.v;render()},
  addPlot(){plotSheet(null)},
  editPlot(d){closeSheet();plotSheet(d.id)},
  closeSheet(){closeSheet()},
  pshape(d){
    if(!cur)return;cur.D.shape=d.v;cur.D.dims={};cur.D.noDiag=false;
    document.querySelectorAll('#pf-shapes .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===d.v));
    $('#pf-dims').innerHTML=dimsHTML();plotRefresh();
  },
  psave(){plotSave(false)},
  psaveAdd(){plotSave(true)},
  pdel(d){confirmBox(t('confirmDelPlot'),()=>{db.plots=db.plots.filter(p=>p.id!==d.id);save();closeSheet();render()})},
  addWorker(){workerForm(null)},
  editWorker(d){workerForm(d.id)},
  wrole(d){wfRole=d.v;document.querySelectorAll('#wf-role .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===d.v))},
  wsave(d){
    const n=$('#wf-name').value.trim();if(!n){toast(t('name'));return}
    if(d.id){const w=db.workers.find(x=>x.id===d.id);if(w)w.name=n}else db.workers.push({id:uid(),name:n,role:wfRole});
    save();render();toast(t('saved'));
    if(d.id)workerSheet(d.id);else closeSheet();
  },
  workerOpen(d){workerSheet(d.id)},
  delWorker(d){confirmBox(t('confirmDelWorker'),()=>{db.workers=db.workers.filter(w=>w.id!==d.id);db.plots=db.plots.filter(p=>p.workerId!==d.id);db.advances=db.advances.filter(a=>a.workerId!==d.id);save();closeSheet();render()})},
  advAdd(d){
    const amt=num($('#adv-amt').value);if(!(amt>0)){toast(t('amount'));return}
    db.advances.push({id:uid(),workerId:d.id,date:$('#adv-date').value||today(),amount:amt,note:$('#adv-note').value.trim()});
    save();render();workerSheet(d.id);toast(t('saved'));
  },
  advDel(d){db.advances=db.advances.filter(a=>a.id!==d.id);save();render();workerSheet(d.w)},
  print(){const old=document.title,rg=rangeDates(),ttl='Pay-Report'+(rg.from?'-'+rg.from+'_'+rg.to:'');document.title=ttl;if(window.AndroidPrint)window.AndroidPrint.print(ttl);else window.print();setTimeout(()=>{document.title=old},1500)},
  share(){
    const s=reportText(),ttl=t('payReport');
    try{if(window.AndroidShare&&window.AndroidShare.text(ttl,s))return}catch(e){}
    try{const C=window.Capacitor;if(C&&C.Plugins&&C.Plugins.Share){C.Plugins.Share.share({title:ttl,text:s}).catch(()=>{});return}}catch(e){}
    if(navigator.share)navigator.share({title:ttl,text:s}).catch(()=>{});else copyText(s);
  },
  addGrass(){db.settings.grass.push({id:uid(),name:t('newGrass'),rate:0});save();renderSettings()},
  delGrass(d){if(db.settings.grass.length<2){toast(t('lastOne'));return}db.settings.grass=db.settings.grass.filter(g=>g.id!==d.id);save();renderSettings()},
  export(){exportData()},
  import(){$('#impFile').value='';$('#impFile').click()},
  reset(){confirmBox(t('confirmReset'),()=>{const l=db.settings.lang;db=defaults();db.settings.lang=l;save();ui.pw='';render()})},
  dlgNo(){$('#dlg').classList.remove('on');dlgCb=null},
  dlgYes(){const cb=dlgCb;A.dlgNo();if(cb)cb()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f)f(el.dataset,el,e)});

document.addEventListener('input',e=>{
  const el=e.target;if(!cur)return;
  if(el.dataset.d!==undefined){cur.D.dims[el.dataset.d]=el.value;plotRefresh();return}
  const f=el.dataset.f;if(!f)return;
  const v=el.type==='checkbox'?el.checked:el.value;
  if(f==='grassId'){
    const g=db.settings.grass.find(x=>x.id===v);cur.D.grassId=v;
    if(g){cur.D.grassName=g.name;cur.D.rate=g.rate;$('#pf-rate').value=g.rate}
  }else cur.D[f]=v;
  if(f==='noDiag')$('#pf-dims').innerHTML=dimsHTML();
  plotRefresh();
});
document.addEventListener('change',e=>{
  const el=e.target,b=el.dataset.bind;if(!b)return;
  const s=db.settings;
  if(b==='rfrom'){ui.range.from=el.value;render()}
  else if(b==='rto'){ui.range.to=el.value;render()}
  else if(b==='pw'){ui.pw=el.value;render()}
  else if(b==='details'){ui.details=el.checked;render()}
  else if(b==='farm'){s.farm=el.value.trim();save();$('#barT').textContent=s.farm||t('appName')}
  else if(b==='kRate'){s.kRate=num(el.value);save()}
  else if(b==='gname'){const g=s.grass.find(x=>x.id===el.dataset.id);if(g){g.name=el.value.trim()||g.name;el.value=g.name;save()}}
  else if(b==='grate'){const g=s.grass.find(x=>x.id===el.dataset.id);if(g){g.rate=num(el.value);save()}}
});
$('#impFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.workers)||!Array.isArray(d.plots))throw 0;
      confirmBox(t('confirmImport'),()=>{db=merge(d);save();render();toast(t('saved'))},t('yes'));
    }catch(x){toast(t('importBad'))}
  };
  r.readAsText(f);
});

render();
</script>
</body>
</html>
